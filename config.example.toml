# Copy to ~/.config/proofd/config.toml. Every key is optional, except that
# openai-compat needs `base_url` and `model`.
# Without a config file, proofd uses claude, or opencode if only it is installed.
# An invalid file makes proofd fail with an error instead of falling back.

# "claude" | "opencode" | "openai-compat"
provider = "claude"

# claude: an alias like "haiku" or "sonnet", or a full model id. Default "haiku".
# opencode: provider/model form. Default "opencode/deepseek-v4.1-flash-free".
# openai-compat: required; the id your server lists, e.g. "qwen/qwen3-4b-2507".
# model = "haiku"

# Path to the provider CLI. Needed only if it is outside PATH, Homebrew,
# ~/.local/bin, ~/.cargo/bin, ~/.opencode/bin, ~/.bun/bin, ~/.npm-global/bin,
# ~/.volta/bin, ~/.local/share/mise/shims, ~/.asdf/shims, or the newest node
# under ~/.nvm or ~/.config/nvm.
# provider_bin = "~/bin/claude"

# Required for openai-compat. No API key is sent, so use a local server
# such as LM Studio.
# base_url = "http://localhost:1234/v1"

# 1 to 600. From the Services menu the limit is about 30 seconds, because the
# app you're typing in stops waiting for the result; higher values only apply
# in the terminal.
timeout_secs = 25

# Longer selections are refused.
max_input_chars = 12000
