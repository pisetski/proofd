# Copy to ~/.config/proofd/config.toml. Every key is optional.
# Without a config file, proofd uses claude, or opencode if only it is installed.
# An invalid file makes proofd fail with an error instead of falling back.

# "claude" | "opencode" | "openai-compat"
provider = "claude"

# claude: an alias like "haiku" or "sonnet", or a full model id.
# opencode: provider/model form, e.g. "opencode/mimo-v2.6-flash-free".
model = "haiku"

# Path to the provider CLI. Needed only if it is outside PATH, Homebrew,
# ~/.local/bin, ~/.cargo/bin, ~/.opencode/bin, or ~/.bun/bin.
# provider_bin = "~/bin/claude"

# Required for openai-compat. No API key is sent, so use a local server
# such as LM Studio.
# base_url = "http://localhost:1234/v1"

# 1 to 600. From the Services menu the limit is about 30 seconds, because the
# app you're typing in stops waiting for the result; higher values only apply
# in the terminal.
timeout_secs = 15

# Longer selections are refused.
max_input_chars = 12000
