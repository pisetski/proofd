[package]
name = "proofd"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Proofreads text from stdin; engine behind the macOS Proofread Selection service"
license = "MIT OR Apache-2.0"

[[bin]]
name = "proofd"
path = "src/main.rs"

[lib]
name = "proofd_lib"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dirs = "7.0.0"
thiserror = "2.0.21"
serde_json = "1.0.151"
async-trait = "0.1.92"

[dev-dependencies]
tempfile = "3.27.0"
plist = "1.10.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
