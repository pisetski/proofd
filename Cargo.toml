[package]
name = "proofd"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Standalone macOS daemon: Ctrl-Option-P polishes selected text via simulated paste"
license = "MIT OR Apache-2.0"

[[bin]]
name = "proofd"
path = "src/main.rs"

[lib]
name = "proofd_lib"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
dirs = "7.0.0"
thiserror = "2.0.21"
tempfile = "3.27.0"
serde_json = "1.0.151"
async-trait = "0.1.92"

[target.'cfg(target_os = "macos")'.dependencies]
enigo = "0.6.1"
arboard = "3.6.1"
tray-icon = "0.25.1"
core-foundation = "0.10.1"
core-graphics = "0.25.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tempfile = "3.27.0"
